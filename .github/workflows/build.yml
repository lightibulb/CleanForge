#Aman
# Independent, reproducible verification: compile, unit tests, lint, debug and release builds on a clean checkout.
# CleanForge itself never talks to the network; this only runs on the CI runner.
#
# The audit requires the Gradle wrapper to be COMMITTED (gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar).
# Until it is, this job still builds (it generates a temporary wrapper), uploads that wrapper as the
# "gradle-wrapper" artifact for you to commit, and then FAILS on purpose so the missing wrapper cannot be overlooked.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Verify the committed Gradle wrapper
        if: hashFiles('gradlew', 'gradle/wrapper/gradle-wrapper.jar') != ''
        uses: gradle/actions/wrapper-validation@v4

      - name: Generate a temporary Gradle wrapper (only if none is committed)
        id: wrapper
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon wrapper --gradle-version 8.9
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest
      - name: Lint (strict; remove continue-on-error after the first clean lint baseline)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug -PstrictLint
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Release APK (unsigned unless keystore.properties exists)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CleanForge-debug.apk
          cp app/build/outputs/apk/release/*.apk out/CleanForge-release$(ls app/build/outputs/apk/release | grep -q unsigned && echo -unsigned).apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanForge-apks
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        if: steps.wrapper.outputs.generated == 'true'
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties

      - name: Fail until the Gradle wrapper is committed
        if: steps.wrapper.outputs.generated == 'true'
        run: |
          echo "::error::The repository has no committed Gradle wrapper, so it cannot be built reproducibly from a clean checkout. Download the 'gradle-wrapper' artifact of this run and commit gradlew, gradlew.bat and gradle/wrapper/*."
          exit 1
