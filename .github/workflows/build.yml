name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest

      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug -PstrictLint

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CleanForge-debug.apk
          test -s out/CleanForge-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanForge-debug-apk
          path: out/CleanForge-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanForge-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish debug APK to GitHub Releases (temporary)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CleanForge-debug-apk
          path: out

      - name: Verify debug APK
        run: test -s out/CleanForge-debug.apk

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: out/CleanForge-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
