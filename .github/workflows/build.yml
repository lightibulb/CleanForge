name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest
      - name: Lint (strict: errors fail the build)
        run: ./gradlew --no-daemon :app:lintDebug -PstrictLint
      - name: Build debug and release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CleanForge-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk out/CleanForge-release.apk
          elif [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/CleanForge-release-unsigned.apk
          else
            echo "::error::No release APK produced"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CleanForge-apks
          path: out/*.apk
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanForge-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: Publish signed APK to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: CleanForge-apks, path: out }
      - name: Require a signed release APK
        shell: bash
        run: |
          if [[ ! -f out/CleanForge-release.apk ]]; then
            echo "::error::The release build is unsigned. Configure signing before publishing a release."
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: out/CleanForge-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
